# DreamBud release workflow
#
# Run it from GitHub: Actions -> Release APK -> Run workflow.
#
# Inputs:
#   version_name (required)  Release version, e.g. 1.2.0 -> tag v1.2.0, versionName
#   version_code (optional)  versionCode; defaults to the workflow run number
#   prerelease    (optional) Mark the GitHub Release as a pre-release
#
# One-time release-signing setup (optional — falls back to a debug-signed APK):
#   1. Create a keystore locally:
#      keytool -genkeypair -v -keystore dreambud-release.jks \
#        -keyalg RSA -keysize 2048 -validity 10000 -alias dreambud
#   2. Add these repo secrets (Settings -> Secrets and variables -> Actions):
#      DREAMBUD_KEYSTORE_BASE64   base64 of the .jks:  base64 -w0 dreambud-release.jks
#      DREAMBUD_KEYSTORE_PASSWORD keystore password
#      DREAMBUD_KEY_ALIAS         key alias (e.g. dreambud)
#      DREAMBUD_KEY_PASSWORD      key password
#   Without the secrets the APK is signed with a CI-generated debug keystore
#   (installable, but signature changes between runs — keep the same signing
#    method across releases to allow update-installs).

name: Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version (e.g. 1.2.0)"
        required: true
        type: string
      version_code:
        description: "versionCode (defaults to the workflow run number)"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.DREAMBUD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dreambud-release.jks"
            echo "DREAMBUD_KEYSTORE_FILE=$RUNNER_TEMP/dreambud-release.jks" >> "$GITHUB_ENV"
            echo "Release keystore configured."
          else
            echo "No release keystore secret found — falling back to debug signing."
          fi

      - name: Resolve version code
        id: version
        env:
          INPUT_CODE: ${{ inputs.version_code }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "$INPUT_CODE" ]; then
            echo "code=$INPUT_CODE" >> "$GITHUB_OUTPUT"
          else
            echo "code=$RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        env:
          DREAMBUD_KEYSTORE_PASSWORD: ${{ secrets.DREAMBUD_KEYSTORE_PASSWORD }}
          DREAMBUD_KEY_ALIAS: ${{ secrets.DREAMBUD_KEY_ALIAS }}
          DREAMBUD_KEY_PASSWORD: ${{ secrets.DREAMBUD_KEY_PASSWORD }}
        run: >
          ./gradlew :app:assembleRelease
          -PversionName=${{ inputs.version_name }}
          -PversionCode=${{ steps.version.outputs.code }}
          --stacktrace

      - name: Prepare APK for upload
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/DreamBud-v${{ inputs.version_name }}.apk"
          ls -lh dist/

      - name: Upload APK artifact (Actions run page)
        uses: actions/upload-artifact@v4
        with:
          name: DreamBud-v${{ inputs.version_name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: DreamBud v${{ inputs.version_name }}
          files: dist/*.apk
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ !inputs.prerelease }}
          fail_on_unmatched_files: true
